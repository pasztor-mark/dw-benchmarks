services:
  tinode:
    image: tinode/tinode-postgres:0.25.3
    platform: linux/amd64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    ports:
      - "${BIND_IP:-127.0.0.1}:6060:6060"
    environment:
      POSTGRES_DSN: "postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/tinode?sslmode=disable&connect_timeout=10"
      WAIT_FOR: "postgres:5432"
      SAMPLE_DATA: ""
    volumes:
      - ./tinode.conf:/opt/tinode/config.template:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6060"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb:2.31.0-pg17
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TIMESCALEDB_TELEMETRY: "off"
      NO_TS_TUNE: "true"
    volumes:
      - ${DATA_ROOT:?}/tinode/live/pg:/var/lib/postgresql/data
      - ../pg-init/999_bench_conf.sh:/docker-entrypoint-initdb.d/999_bench_conf.sh:ro
      - ${PG_CONF:-../postgres.conf}:/etc/postgresql/bench.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
