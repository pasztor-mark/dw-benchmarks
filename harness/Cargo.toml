[package]
name = "dwbench"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hdrhistogram = "7.6.0"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
libc = "0.2.191"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "1.2.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
